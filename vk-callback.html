<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK OAuth — Здоровый ритм</title>
</head>
<body>
  <h2>Подключение VK</h2>
  <p id="status">Передача авторизации SMM Agent...</p>

  <script>
    (function () {
      const status = document.getElementById("status");

      const hash = window.location.hash;

      if (!hash || !hash.includes("access_token=")) {
        status.textContent =
          "Токен VK не найден. Запустите авторизацию VK заново.";
        return;
      }

      status.textContent =
        "Авторизация получена. Передаю данные SMM Agent...";

      // Передаём OAuth-данные локальному агенту.
      window.location.href =
        "http://127.0.0.1:8765/vk/oauth/callback" + hash;
    })();
  </script>
</body>
</html>
